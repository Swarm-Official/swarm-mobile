appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "welcome.title"
    timeout: 300000
- takeScreenshot: welcome
- tapOn:
    id: "loadingapp.createnewwallet"
- extendedWaitUntil:
    visible: "Before you start"
    timeout: 30000
- tapOn: "I understand"
- extendedWaitUntil:
    visible:
      id: "newseed.continue"
    timeout: 600000
- tapOn:
    id: "newseed.continue"
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- assertVisible:
    id: "header.wallets"
- assertVisible:
    id: "header.addresses"
- takeScreenshot: home-synced
- tapOn:
    id: "tab.send"
- takeScreenshot: send-empty-wallet
- tapOn:
    id: "tab.receive"
- assertVisible:
    id: "receive.title"
- takeScreenshot: receive
- tapOn:
    id: "header.wallets"
- extendedWaitUntil:
    visible:
      id: "wallets.active.1"
    timeout: 30000
- tapOn:
    id: "wallets.create"
- extendedWaitUntil:
    visible:
      id: "welcome.title"
    timeout: 60000
- tapOn:
    id: "loadingapp.createnewwallet"
- extendedWaitUntil:
    visible:
      id: "newseed.continue"
    timeout: 600000
- tapOn:
    id: "newseed.continue"
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- tapOn:
    id: "header.wallets"
- extendedWaitUntil:
    visible:
      id: "wallets.active.2"
    timeout: 30000
- takeScreenshot: two-wallets
- tapOn:
    id: "wallets.open.1"
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- tapOn:
    id: "header.wallets"
- extendedWaitUntil:
    visible:
      id: "wallets.active.1"
    timeout: 30000
- assertVisible:
    id: "wallets.open.2"
- takeScreenshot: first-wallet-restored
