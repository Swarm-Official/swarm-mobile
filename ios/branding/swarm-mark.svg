<?xml version="1.0" encoding="UTF-8"?>
<!--
  SWARM hive-bee mark.

  Geometry copied verbatim from the SWARM design system (Swarm Style Guide
  v2, section 02 "Logo & mark"): a hexagonal body — one cell of the hive —
  with two stripes in the background colour and two honey elliptical wings.
  Symmetric, frontal, geometric.

  Rules: never tilt the mark, never add a face. The two rotations below
  belong to the wings and are part of the mark itself; the mark as a whole
  is always upright.

    body    #FF8A1F  swarm orange
    wings   #FFB020  honey
    stripes #0A0908  warm black (the background colour, so they read as
                     cut-outs; swap this fill when the mark sits on a light
                     surface, exactly as the style guide's variants do)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <ellipse cx="21" cy="17" rx="12" ry="6.5" transform="rotate(-28 21 17)" fill="#FFB020"/>
  <ellipse cx="43" cy="17" rx="12" ry="6.5" transform="rotate(28 43 17)" fill="#FFB020"/>
  <path d="M32 22 L46 30 L46 48 L32 56 L18 48 L18 30 Z" fill="#FF8A1F"/>
  <rect x="18" y="35" width="28" height="4" fill="#0A0908"/>
  <rect x="18" y="44" width="28" height="4" fill="#0A0908"/>
</svg>
